[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchdog-forensic-fincrime-methods-companion"
version = "0.1.0"
description = "Public methods companion scaffold for the Watchdog Forensic Fincrime series."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
